id: repository-audit
name: Repository Audit
description: Read-only architecture and quality audit producing a report and backlog suggestions.
read_only: true
phases:
  - id: bootstrap
    required_artifacts: [repository-profile]
  - id: discover
    required_artifacts: [discovery-notes]
  - id: audit
    required_artifacts: []
  - id: report
    required_artifacts: [audit-report]
  - id: deliver
    required_artifacts: [delivery-preparation]
    gates: [delivery-signoff]
