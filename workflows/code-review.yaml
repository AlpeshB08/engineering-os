id: code-review
name: Code Review
description: Diff-scoped review against standards, reuse rules, and checklists.
read_only: true
phases:
  - id: bootstrap
    required_artifacts: [repository-profile]
  - id: discover
    required_artifacts: [discovery-notes]
  - id: review
    required_artifacts: [review-notes]
  - id: report
    required_artifacts: [report]
