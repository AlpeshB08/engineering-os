id: refactoring
name: Refactoring
description: Structural improvement with mandatory risk/architecture approval, verification, and review.
read_only: false
phases:
  - id: bootstrap
    required_artifacts: [repository-profile]
  - id: discover
    required_artifacts: [discovery-notes]
  - id: plan
    required_artifacts:
      [implementation-plan, verification-plan, feature-impact, reuse-analysis]
    gates: [architecture-approval]
  - id: approve
    requires_gates: [architecture-approval]
  - id: implement
    requires_gates: [architecture-approval]
  - id: verify
    required_artifacts: [verification-evidence]
  - id: review
    required_artifacts: [review-notes]
  - id: deliver
    required_artifacts: [delivery-preparation]
    gates: [delivery-signoff]
