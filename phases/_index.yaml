phases:
  - id: bootstrap
    file: bootstrap.md
    summary: Ensure Engineering OS is initialized and Repository Profile exists.
  - id: discover
    file: discover.md
    summary: Inspect the repository and produce evidence-based discovery notes.
  - id: intel-scan
    file: intel-scan.md
    summary: Generate Project DNA, summaries, and dependency graphs.
  - id: contract
    file: contract.md
    summary: Define scope and acceptance criteria in a Feature Contract.
  - id: plan
    file: plan.md
    summary: Produce implementation, impact, reuse, backend, and verification plans.
  - id: approve
    file: approve.md
    summary: Stop for human gates required before implementation.
  - id: implement
    file: implement.md
    summary: Execute the approved plan with reuse-first changes.
  - id: verify
    file: verify.md
    summary: Run capability-aware verification and capture evidence.
  - id: review
    file: review.md
    summary: Review changes against standards and produce review notes.
  - id: audit
    file: audit.md
    summary: Perform a read-only repository audit.
  - id: report
    file: report.md
    summary: Produce a structured report artifact.
  - id: deliver
    file: deliver.md
    summary: Prepare delivery artifacts and obtain delivery sign-off.
